<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
  <!-- Undulating vine -->
  <path d="M0,30 C50,15 100,45 160,30 C220,15 280,45 340,30 C370,22 386,24 400,30 C414,36 430,38 460,30 C520,15 580,45 640,30 C700,15 760,45 800,30" stroke-width="0.8"/>

  <!-- Center 6-petal flower -->
  <g transform="translate(400,30)">
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.8"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.8" transform="rotate(60)"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.8" transform="rotate(120)"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.8" transform="rotate(180)"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.8" transform="rotate(240)"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.8" transform="rotate(300)"/>
    <circle r="4.5" stroke-width="0.8"/>
    <circle r="1.8" fill="#111" stroke="none"/>
  </g>

  <!-- Left flower -->
  <g transform="translate(165,43)">
    <ellipse cy="-8" rx="3.5" ry="5.5" stroke-width="0.75"/>
    <ellipse cy="-8" rx="3.5" ry="5.5" stroke-width="0.75" transform="rotate(72)"/>
    <ellipse cy="-8" rx="3.5" ry="5.5" stroke-width="0.75" transform="rotate(144)"/>
    <ellipse cy="-8" rx="3.5" ry="5.5" stroke-width="0.75" transform="rotate(216)"/>
    <ellipse cy="-8" rx="3.5" ry="5.5" stroke-width="0.75" transform="rotate(288)"/>
    <circle r="3.5" stroke-width="0.75"/>
    <circle r="1.4" fill="#111" stroke="none"/>
  </g>

  <!-- Right flower -->
  <g transform="translate(635,43)">
    <ellipse cy="-8" rx="3.5" ry="5.5" stroke-width="0.75"/>
    <ellipse cy="-8" rx="3.5" ry="5.5" stroke-width="0.75" transform="rotate(72)"/>
    <ellipse cy="-8" rx="3.5" ry="5.5" stroke-width="0.75" transform="rotate(144)"/>
    <ellipse cy="-8" rx="3.5" ry="5.5" stroke-width="0.75" transform="rotate(216)"/>
    <ellipse cy="-8" rx="3.5" ry="5.5" stroke-width="0.75" transform="rotate(288)"/>
    <circle r="3.5" stroke-width="0.75"/>
    <circle r="1.4" fill="#111" stroke="none"/>
