  <!-- Leaves — left of center -->
  <g transform="translate(82,20) rotate(-15)">
    <path d="M0,0 Q9,-14 0,-25 Q-9,-14 0,0" stroke-width="0.75"/>
    <line x1="0" y1="-1" x2="0" y2="-24" stroke-width="0.4"/>
  </g>
  <g transform="translate(112,40) rotate(25)">
    <path d="M0,0 Q8,-12 0,-22 Q-8,-12 0,0" stroke-width="0.7"/>
    <line x1="0" y1="-1" x2="0" y2="-21" stroke-width="0.38"/>
  </g>
  <g transform="translate(252,19) rotate(-20)">
    <path d="M0,0 Q8,-12 0,-22 Q-8,-12 0,0" stroke-width="0.7"/>
    <line x1="0" y1="-1" x2="0" y2="-21" stroke-width="0.38"/>
  </g>
  <g transform="translate(312,41) rotate(15)">
    <path d="M0,0 Q7,-10 0,-18 Q-7,-10 0,0" stroke-width="0.65"/>
    <line x1="0" y1="-1" x2="0" y2="-17" stroke-width="0.35"/>
  </g>

  <!-- Leaves — right of center (mirror) -->
  <g transform="translate(718,20) rotate(15)">
    <path d="M0,0 Q9,-14 0,-25 Q-9,-14 0,0" stroke-width="0.75"/>
    <line x1="0" y1="-1" x2="0" y2="-24" stroke-width="0.4"/>
  </g>
  <g transform="translate(688,40) rotate(-25)">
    <path d="M0,0 Q8,-12 0,-22 Q-8,-12 0,0" stroke-width="0.7"/>
    <line x1="0" y1="-1" x2="0" y2="-21" stroke-width="0.38"/>
  </g>
  <g transform="translate(548,19) rotate(20)">
    <path d="M0,0 Q8,-12 0,-22 Q-8,-12 0,0" stroke-width="0.7"/>
    <line x1="0" y1="-1" x2="0" y2="-21" stroke-width="0.38"/>
  </g>
  <g transform="translate(488,41) rotate(-15)">
    <path d="M0,0 Q7,-10 0,-18 Q-7,-10 0,0" stroke-width="0.65"/>
    <line x1="0" y1="-1" x2="0" y2="-17" stroke-width="0.35"/>
  </g>

  <!-- Rose buds -->
  <g transform="translate(42,28)">
    <path d="M0,-3 Q-3.5,-8 0,-13 Q3.5,-8 0,-3" stroke-width="0.7"/>
    <path d="M0,-7 Q-5.5,-10 0,-15 Q5.5,-10 0,-7" stroke-width="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-3" stroke-width="0.7"/>
  </g>
  <g transform="translate(758,32)">
    <path d="M0,-3 Q-3.5,-8 0,-13 Q3.5,-8 0,-3" stroke-width="0.7"/>
    <path d="M0,-7 Q-5.5,-10 0,-15 Q5.5,-10 0,-7" stroke-width="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-3" stroke-width="0.7"/>
  </g>
</svg>
