<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
  <!-- Undulating vine -->
  <path d="M0,30 C50,15 100,45 160,30 C220,15 280,45 340,30 C370,22 386,24 400,30 C414,36 430,38 460,30 C520,15 580,45 640,30 C700,15 760,45 800,30" stroke-width="0.8"/>

  <!-- ROSE at center (400,30) — 5 outer + 5 inner petals -->
  <g transform="translate(400,30)">
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.82"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.82" transform="rotate(72)"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.82" transform="rotate(144)"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.82" transform="rotate(216)"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.82" transform="rotate(288)"/>
    <!-- inner ring offset 36° -->
    <ellipse cy="-6.5" rx="3" ry="5" stroke-width="0.7" transform="rotate(36)"/>
    <ellipse cy="-6.5" rx="3" ry="5" stroke-width="0.7" transform="rotate(108)"/>
    <ellipse cy="-6.5" rx="3" ry="5" stroke-width="0.7" transform="rotate(180)"/>
    <ellipse cy="-6.5" rx="3" ry="5" stroke-width="0.7" transform="rotate(252)"/>
    <ellipse cy="-6.5" rx="3" ry="5" stroke-width="0.7" transform="rotate(324)"/>
    <circle r="3.2" stroke-width="0.75"/>
    <circle r="1.3" fill="#111" stroke="none"/>
  </g>

  <!-- CHERRY BLOSSOM left (165,43) — 5 wide round petals with notch -->
  <g transform="translate(165,43)">
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(72)"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(144)"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(216)"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(288)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.35"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.35" transform="rotate(72)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.35" transform="rotate(144)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.35" transform="rotate(216)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.35" transform="rotate(288)"/>
    <circle r="3" stroke-width="0.7"/>
    <circle r="1.2" fill="#111" stroke="none"/>
  </g>

  <!-- CHERRY BLOSSOM right (635,17) — mirrored position on vine peak -->
  <g transform="translate(635,17)">
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(72)"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(144)"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(216)"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(288)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.35"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.35" transform="rotate(72)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.35" transform="rotate(144)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.35" transform="rotate(216)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.35" transform="rotate(288)"/>
    <circle r="3" stroke-width="0.7"/>
    <circle r="1.2" fill="#111" stroke="none"/>
  </g>

  <!-- WILDFLOWER 4-petal, left quarter (280,45) -->
  <g transform="translate(280,45)">
    <ellipse cy="-6" rx="2.8" ry="4.5" stroke-width="0.68"/>
    <ellipse cy="-6" rx="2.8" ry="4.5" stroke-width="0.68" transform="rotate(90)"/>
    <ellipse cy="-6" rx="2.8" ry="4.5" stroke-width="0.68" transform="rotate(180)"/>
    <ellipse cy="-6" rx="2.8" ry="4.5" stroke-width="0.68" transform="rotate(270)"/>
    <circle r="2.2" stroke-width="0.65"/>
    <circle r="0.9" fill="#111" stroke="none"/>
  </g>

  <!-- WILDFLOWER 4-petal, right quarter (520,15) -->
  <g transform="translate(520,15)">
    <ellipse cy="-6" rx="2.8" ry="4.5" stroke-width="0.68"/>
    <ellipse cy="-6" rx="2.8" ry="4.5" stroke-width="0.68" transform="rotate(90)"/>
    <ellipse cy="-6" rx="2.8" ry="4.5" stroke-width="0.68" transform="rotate(180)"/>
    <ellipse cy="-6" rx="2.8" ry="4.5" stroke-width="0.68" transform="rotate(270)"/>
    <circle r="2.2" stroke-width="0.65"/>
    <circle r="0.9" fill="#111" stroke="none"/>
  </g>

  <!-- Leaves — left of center -->
  <g transform="translate(82,20) rotate(-15)">
    <path d="M0,0 Q9,-14 0,-25 Q-9,-14 0,0" stroke-width="0.75"/>
    <line x1="0" y1="-1" x2="0" y2="-24" stroke-width="0.4"/>
  </g>
  <g transform="translate(112,40) rotate(25)">
    <path d="M0,0 Q8,-12 0,-22 Q-8,-12 0,0" stroke-width="0.7"/>
    <line x1="0" y1="-1" x2="0" y2="-21" stroke-width="0.38"/>
  </g>
  <g transform="translate(230,17) rotate(-20)">
    <path d="M0,0 Q8,-12 0,-22 Q-8,-12 0,0" stroke-width="0.7"/>
    <line x1="0" y1="-1" x2="0" y2="-21" stroke-width="0.38"/>
  </g>
  <g transform="translate(312,41) rotate(15)">
    <path d="M0,0 Q7,-10 0,-18 Q-7,-10 0,0" stroke-width="0.65"/>
    <line x1="0" y1="-1" x2="0" y2="-17" stroke-width="0.35"/>
  </g>
  <g transform="translate(358,24) rotate(-10)">
    <path d="M0,0 Q6,-9 0,-16 Q-6,-9 0,0" stroke-width="0.62"/>
  </g>

  <!-- Leaves — right of center -->
  <g transform="translate(718,20) rotate(15)">
    <path d="M0,0 Q9,-14 0,-25 Q-9,-14 0,0" stroke-width="0.75"/>
    <line x1="0" y1="-1" x2="0" y2="-24" stroke-width="0.4"/>
  </g>
  <g transform="translate(688,40) rotate(-25)">
    <path d="M0,0 Q8,-12 0,-22 Q-8,-12 0,0" stroke-width="0.7"/>
    <line x1="0" y1="-1" x2="0" y2="-21" stroke-width="0.38"/>
  </g>
  <g transform="translate(570,43) rotate(20)">
    <path d="M0,0 Q8,-12 0,-22 Q-8,-12 0,0" stroke-width="0.7"/>
    <line x1="0" y1="-1" x2="0" y2="-21" stroke-width="0.38"/>
  </g>
  <g transform="translate(488,36) rotate(-15)">
    <path d="M0,0 Q7,-10 0,-18 Q-7,-10 0,0" stroke-width="0.65"/>
    <line x1="0" y1="-1" x2="0" y2="-17" stroke-width="0.35"/>
  </g>
  <g transform="translate(442,18) rotate(10)">
    <path d="M0,0 Q6,-9 0,-16 Q-6,-9 0,0" stroke-width="0.62"/>
  </g>

  <!-- Rose buds far left and right -->
  <g transform="translate(42,28)">
    <path d="M0,-3 Q-3.5,-8 0,-13 Q3.5,-8 0,-3" stroke-width="0.7"/>
    <path d="M0,-7 Q-5.5,-10 0,-15 Q5.5,-10 0,-7" stroke-width="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-3" stroke-width="0.7"/>
  </g>
  <g transform="translate(758,32)">
    <path d="M0,-3 Q-3.5,-8 0,-13 Q3.5,-8 0,-3" stroke-width="0.7"/>
    <path d="M0,-7 Q-5.5,-10 0,-15 Q5.5,-10 0,-7" stroke-width="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-3" stroke-width="0.7"/>
  </g>

  <!-- Small TULIP bud on vine left side (126,17) -->
  <g transform="translate(126,17)">
    <path d="M0,-1 Q-4,-4 -3,-9 Q-1,-10 0,-7" stroke-width="0.65"/>
    <path d="M0,-1 Q4,-4 3,-9 Q1,-10 0,-7" stroke-width="0.65"/>
    <path d="M-0.5,-6 Q-1,-9 0,-12 Q1,-9 0.5,-6" stroke-width="0.65"/>
    <line x1="0" y1="1" x2="0" y2="-1" stroke-width="0.7"/>
  </g>

  <!-- Small TULIP bud on vine right side (674,43) -->
  <g transform="translate(674,43)">
    <path d="M0,-1 Q-4,-4 -3,-9 Q-1,-10 0,-7" stroke-width="0.65"/>
    <path d="M0,-1 Q4,-4 3,-9 Q1,-10 0,-7" stroke-width="0.65"/>
    <path d="M-0.5,-6 Q-1,-9 0,-12 Q1,-9 0.5,-6" stroke-width="0.65"/>
    <line x1="0" y1="1" x2="0" y2="-1" stroke-width="0.7"/>
  </g>
</svg>
