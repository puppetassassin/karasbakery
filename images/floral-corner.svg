<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main curved stem -->
  <path d="M15,148 C40,115 68,85 95,58 C112,40 132,22 148,10" stroke-width="0.9"/>

  <!-- Branch 1 — reaches right toward cherry blossom -->
  <path d="M68,82 C82,68 98,60 112,55" stroke-width="0.8"/>
  <!-- Branch 2 — redirected LEFT away from main tip (no crowding) -->
  <path d="M95,58 C90,50 84,40 78,30" stroke-width="0.75"/>

  <!-- ROSE at main tip (148,10) — 5 outer + 5 inner petals -->
  <g transform="translate(148,10)">
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.82"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.82" transform="rotate(72)"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.82" transform="rotate(144)"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.82" transform="rotate(216)"/>
    <ellipse cy="-10" rx="4.5" ry="7.5" stroke-width="0.82" transform="rotate(288)"/>
    <ellipse cy="-6.5" rx="3" ry="5" stroke-width="0.7" transform="rotate(36)"/>
    <ellipse cy="-6.5" rx="3" ry="5" stroke-width="0.7" transform="rotate(108)"/>
    <ellipse cy="-6.5" rx="3" ry="5" stroke-width="0.7" transform="rotate(180)"/>
    <ellipse cy="-6.5" rx="3" ry="5" stroke-width="0.7" transform="rotate(252)"/>
    <ellipse cy="-6.5" rx="3" ry="5" stroke-width="0.7" transform="rotate(324)"/>
    <circle r="3.2" stroke-width="0.75"/>
    <circle r="1.3" fill="#111" stroke="none"/>
  </g>

  <!-- CHERRY BLOSSOM at branch 1 tip (112,55) -->
  <g transform="translate(112,55)">
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(72)"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(144)"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(216)"/>
    <ellipse cy="-8" rx="4.8" ry="5.8" stroke-width="0.75" transform="rotate(288)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.38"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.38" transform="rotate(72)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.38" transform="rotate(144)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.38" transform="rotate(216)"/>
    <line x1="0" y1="-13.5" x2="0" y2="-11.5" stroke-width="0.38" transform="rotate(288)"/>
    <circle r="3" stroke-width="0.7"/>
    <circle r="1.2" fill="#111" stroke="none"/>
  </g>

  <!-- TULIP BUD at branch 2 tip (78,30) — well separated from main rose -->
  <g transform="translate(78,30)">
    <path d="M0,-1 Q-4,-5 -3.5,-11 Q-1,-12 0,-8" stroke-width="0.72"/>
    <path d="M0,-1 Q4,-5 3.5,-11 Q1,-12 0,-8" stroke-width="0.72"/>
    <path d="M-0.5,-7 Q-1,-11 0,-15 Q1,-11 0.5,-7" stroke-width="0.72"/>
    <path d="M0,-1 Q-2,0 -3,3" stroke-width="0.5"/>
    <path d="M0,-1 Q2,0 3,3" stroke-width="0.5"/>
    <line x1="0" y1="3" x2="0" y2="-1" stroke-width="0.75"/>
  </g>

  <!-- Leaves on main stem -->
  <g transform="translate(68,82) rotate(-50)">
    <path d="M0,0 Q10,-15 0,-27 Q-10,-15 0,0" stroke-width="0.7"/>
    <line x1="0" y1="-1" x2="0" y2="-26" stroke-width="0.38"/>
  </g>
  <g transform="translate(44,110) rotate(-35)">
    <path d="M0,0 Q9,-13 0,-23 Q-9,-13 0,0" stroke-width="0.7"/>
    <line x1="0" y1="-1" x2="0" y2="-22" stroke-width="0.38"/>
  </g>
  <g transform="translate(100,50) rotate(-65)">
    <path d="M0,0 Q8,-11 0,-20 Q-8,-11 0,0" stroke-width="0.65"/>
    <line x1="0" y1="-1" x2="0" y2="-19" stroke-width="0.35"/>
  </g>

  <!-- Small leaves -->
  <g transform="translate(56,95) rotate(-22)">
    <path d="M0,0 Q6,-9 0,-16 Q-6,-9 0,0" stroke-width="0.62"/>
  </g>
  <g transform="translate(82,66) rotate(-78)">
    <path d="M0,0 Q6,-9 0,-16 Q-6,-9 0,0" stroke-width="0.62"/>
  </g>
  <g transform="translate(120,38) rotate(-50)">
    <path d="M0,0 Q5,-7 0,-13 Q-5,-7 0,0" stroke-width="0.6"/>
  </g>
  <g transform="translate(132,26) rotate(-38)">
    <path d="M0,0 Q5,-7 0,-13 Q-5,-7 0,0" stroke-width="0.6"/>
  </g>
  <g transform="translate(88,44) rotate(-72)">
    <path d="M0,0 Q5,-7 0,-13 Q-5,-7 0,0" stroke-width="0.6"/>
  </g>
  <g transform="translate(30,126) rotate(-15)">
    <path d="M0,0 Q5,-7 0,-13 Q-5,-7 0,0" stroke-width="0.58"/>
  </g>
  <!-- Leaves off branch 2 -->
  <g transform="translate(84,48) rotate(-82)">
    <path d="M0,0 Q5,-7 0,-13 Q-5,-7 0,0" stroke-width="0.6"/>
  </g>
  <g transform="translate(72,36) rotate(-60)">
    <path d="M0,0 Q5,-7 0,-13 Q-5,-7 0,0" stroke-width="0.58"/>
  </g>

  <!-- Small 4-petal flower near base -->
  <g transform="translate(22,140)">
    <ellipse cy="-5.5" rx="2.5" ry="4" stroke-width="0.6"/>
    <ellipse cy="-5.5" rx="2.5" ry="4" stroke-width="0.6" transform="rotate(90)"/>
    <ellipse cy="-5.5" rx="2.5" ry="4" stroke-width="0.6" transform="rotate(180)"/>
    <ellipse cy="-5.5" rx="2.5" ry="4" stroke-width="0.6" transform="rotate(270)"/>
    <circle r="2" stroke-width="0.6"/>
    <circle r="0.8" fill="#111" stroke="none"/>
  </g>
</svg>
